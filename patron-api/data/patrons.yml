# Seed data for the Patron Record API (stands in for the ILS: Alma, FOLIO, Sierra...).
# Records are keyed by NetID, the identifier CAS has always provided.
# entra_oid starts empty and is linked on a patron's first Entra sign-in
# (see PatronStore#link_oid and docs/01-auth-upgrade-playbook.md, "Identifier crosswalk").
# due_in_days is relative to the day the API starts, so the demo always has
# items due soon and items overdue.
